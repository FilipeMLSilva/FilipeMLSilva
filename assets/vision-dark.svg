<svg xmlns="http://www.w3.org/2000/svg" width="590" height="320" viewBox="0 0 590 320" role="img" aria-label="V.I.S.I.O.N: Very Intelligent System Inside One Network">
<rect width="590" height="320" rx="24" fill="#17171a"/>
<text x="40" y="52" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="3" fill="#6c6c74">PROJECT  ·  01</text>
<text x="38" y="100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="200" letter-spacing="1" fill="#f2f2f3">V.I.S.I.O.N</text>
<text x="40" y="124" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#6c6c74">Very Intelligent System Inside One Network</text>
<text x="40" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a6a6ad">An assistant that observes how work happens on one</text><text x="40" y="175" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a6a6ad">machine, remembers it, and answers from that record.</text><text x="40" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#a6a6ad">Local-first: nothing leaves the machine.</text>
<rect x="40" y="252" width="71" height="28" rx="14" fill="#222226"/><text x="76" y="271" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.5" fill="#a6a6ad">Python</text><rect x="119.19999999999999" y="252" width="112" height="28" rx="14" fill="#222226"/><text x="175" y="271" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.5" fill="#a6a6ad">local-first</text>
<circle cx="358" cy="266" r="4" fill="#f5a524"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="370" y="271" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.5" fill="#f5a524">release in preparation</text>
</svg>