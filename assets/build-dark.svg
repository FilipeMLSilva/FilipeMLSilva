<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="How I build: build first, people decide, prove it, stay quiet.">
<rect width="1200" height="200" rx="24" fill="#17171a"/><text x="40" y="50" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#f5a524">01</text><text x="40" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#f2f2f3">Build first</text><text x="40" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">The working system comes first.</text><text x="40" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">Its shape is read after.</text><text x="330" y="50" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#f5a524">02</text><text x="330" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#f2f2f3">People decide</text><text x="330" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">Agents implement and code</text><text x="330" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">coordinates. A person says yes.</text><text x="620" y="50" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#f5a524">03</text><text x="620" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#f2f2f3">Prove it</text><text x="620" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">A test must fail on the broken</text><text x="620" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">version, or it proves nothing.</text><text x="910" y="50" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#f5a524">04</text><text x="910" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#f2f2f3">Stay quiet</text><text x="910" y="118" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">Colour means state. Everything</text><text x="910" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a6a6ad">else stays out of the way.</text>
</svg>